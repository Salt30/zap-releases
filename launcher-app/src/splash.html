<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    width: 100%; height: 100%;
    background: transparent;
    overflow: hidden;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
    -webkit-app-region: drag;
    user-select: none;
  }
  .container {
    width: 100%; height: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    background: rgba(18, 18, 22, 0.95);
    border-radius: 16px;
    border: 1px solid rgba(255,255,255,0.06);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 28px;
  }
  .icon {
    width: 56px; height: 56px;
    margin-bottom: 16px;
    animation: pulse 2s ease-in-out infinite;
  }
  .icon svg { width: 100%; height: 100%; }
  @keyframes pulse {
    0%, 100% { opacity: 0.8; transform: scale(1); }
    50% { opacity: 1; transform: scale(1.05); }
  }
  .title {
    font-size: 15px; font-weight: 600;
    color: #e4e4e7;
    margin-bottom: 14px;
    letter-spacing: -0.2px;
  }
  .progress-track {
    width: 200px; height: 4px;
    background: rgba(255,255,255,0.08);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 10px;
  }
  .progress-bar {
    height: 100%; width: 0%;
    background: linear-gradient(90deg, #4a6fa5, #6d9eeb);
    border-radius: 2px;
    transition: width 0.3s ease;
  }
  #status {
    font-size: 11px;
    color: rgba(228,228,231,0.5);
    text-align: center;
  }
</style>
</head>
<body>
<div class="container">
  <div class="icon">
    <svg viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="56" height="56" rx="12" fill="#1a1a2e"/>
      <path d="M18 38V18L28 28L38 18V38" stroke="#4a6fa5" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
      <circle cx="28" cy="28" r="4" fill="#6d9eeb" opacity="0.8"/>
    </svg>
  </div>
  <div class="title">Zap Pro</div>
  <div class="progress-track"><div class="progress-bar" id="bar"></div></div>
  <div id="status">Starting...</div>
</div>
</body>
</html>
