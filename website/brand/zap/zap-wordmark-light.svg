<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 120" width="360" height="120" role="img" aria-label="Zap logo">
  <defs>
    <linearGradient id="wml-bolt" x1="12" y1="8" x2="72" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f5a623"/>
      <stop offset="0.5" stop-color="#f0a013"/>
      <stop offset="1" stop-color="#d98a06"/>
    </linearGradient>
  </defs>
  <!-- mark on light: keep the dark tile so the gold reads -->
  <rect x="12" y="12" width="96" height="96" rx="24" fill="#0d0d22"/>
  <g transform="translate(30 26) scale(2.75)">
    <path d="M13 2 L3 14 L12 14 L11 22 L21 10 L12 10 Z" fill="#ffd24d" stroke="#ffd24d" stroke-width="0.6" stroke-linejoin="round"/>
  </g>
  <!-- wordmark in ink for light backgrounds -->
  <text x="130" y="60" dominant-baseline="central" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="600" letter-spacing="-2" fill="#0a0a16">Zap</text>
</svg>
