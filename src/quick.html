<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none'">
  <link rel="icon" href="zap-icon.svg" type="image/svg+xml">
  <title>Zap · Drip Type</title>
  <style>
    :root { color-scheme:dark; --text:#f7f7f8; --muted:#92949d; --subtle:#6c6f78; --accent:#ffd24d; --accent-ink:#09090d; --border:rgba(255,255,255,.13); --panel:rgba(15,15,24,.9); }
    :root[data-theme="light"] { color-scheme:light; --text:#1b1d22; --muted:#62666e; --subtle:#858991; --accent:#dfb021; --accent-ink:#211b08; --border:rgba(28,31,37,.14); --panel:rgba(251,250,246,.9); }
    * { box-sizing:border-box; }
    html,body { width:100%; height:100%; margin:0; overflow:hidden; background:transparent; }
    body { padding:10px; color:var(--text); font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    .shell { display:flex; flex-direction:column; height:100%; overflow:hidden; border:1px solid var(--border); border-radius:16px; background:var(--panel); box-shadow:0 24px 72px rgba(0,0,0,.46),0 1px 0 rgba(255,255,255,.07) inset; backdrop-filter:blur(34px) saturate(145%); -webkit-backdrop-filter:blur(34px) saturate(145%); -webkit-app-region:drag; }
    :root[data-full-screen="true"] body { padding:0; }
    :root[data-full-screen="true"] .shell { border:0; border-radius:0; }
    .header { display:flex; align-items:center; min-height:48px; padding:0 12px 0 15px; border-bottom:1px solid rgba(255,255,255,.08); }
    .mark { width:24px; height:24px; margin-right:9px; border-radius:7px; }
    .title { font-size:13px; font-weight:680; letter-spacing:-.01em; }
    .byline { margin-left:6px; color:var(--subtle); font-size:10px; font-weight:600; letter-spacing:.12em; text-transform:uppercase; }
    .window-actions { display:flex; gap:6px; margin-left:auto; -webkit-app-region:no-drag; }
    .window-action { display:grid; place-items:center; width:29px; height:29px; padding:0; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.035); color:var(--muted); font:14px/1 -apple-system,sans-serif; cursor:pointer; }
    .window-action:hover { background:rgba(255,255,255,.09); color:var(--text); }
    textarea { display:block; flex:1 1 auto; width:100%; min-height:190px; padding:19px 20px; resize:none; border:0; outline:0; background:transparent; color:var(--text); caret-color:var(--accent); font:15px/1.58 -apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; user-select:text; -webkit-app-region:no-drag; }
    textarea::placeholder { color:var(--subtle); }
    .footer { display:flex; align-items:center; gap:16px; min-height:64px; padding:10px 12px 10px 18px; border-top:1px solid rgba(255,255,255,.08); background:rgba(255,255,255,.018); -webkit-app-region:no-drag; }
    .copy { min-width:0; display:grid; gap:3px; }
    .focus-hint { color:var(--muted); font-size:11px; font-weight:600; }
    .state { color:var(--subtle); font-size:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    button { border:0; font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",sans-serif; }
    button:focus-visible, textarea:focus-visible { outline:2px solid var(--accent); outline-offset:3px; }
    button:disabled { opacity:.4; cursor:default; }
    .submit { flex:0 0 auto; min-width:118px; height:38px; padding:0 16px; border-radius:9px; background:var(--accent); color:var(--accent-ink); font-size:12px; font-weight:700; cursor:pointer; }
    .submit:hover:not(:disabled) { filter:brightness(1.04); transform:translateY(-1px); }
  </style>
  <link rel="stylesheet" href="native.css">
</head>
<body class="quick-app">
  <main class="shell">
    <header class="header">
      <img class="mark" src="zap-icon.svg" alt="">
      <span class="title">Zap</span><span class="byline">Drip Type</span>
      <div class="window-actions">
        <button class="window-action" id="toggle-full-screen" type="button" title="Enter full screen (⌃⌘F)" aria-label="Enter full screen">⛶</button>
        <button class="window-action" id="close" type="button" title="Close (Esc)" aria-label="Close">×</button>
      </div>
    </header>
    <textarea id="text" spellcheck="true" maxlength="100000" aria-label="Text to type" placeholder="Paste or write your text here…"></textarea>
    <footer class="footer">
      <div class="copy"><span class="focus-hint" id="focus-hint">Window hides. Click the destination field before typing starts.</span><span class="state" id="state">Private draft · kept in memory only</span></div>
      <button class="submit" id="submit" type="button" disabled>Start typing</button>
    </footer>
  </main>
  <script src="quick.js"></script>
</body>
</html>
