name: Signed macOS release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to rebuild
        required: true
        type: string
  create:

permissions:
  contents: read

concurrency:
  group: mac-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build universal macOS app
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
      }}
    runs-on: macos-14
    environment: production-signing
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          CREATED_REF: ${{ github.event.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_TAG"
          else
            RELEASE_TAG="${CREATED_REF#release/}"
            RELEASE_TAG="${RELEASE_TAG%%/*}"
          fi

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" == "v${PACKAGE_VERSION}" ]]

          RELEASE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          [[ "$RELEASE_SHA" == "$MAIN_SHA" ]]

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: |
          npm run verify
          npm audit --audit-level=low
          npm audit signatures

      - name: Import Developer ID certificate
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          : "${MAC_CERTIFICATE_P12_BASE64:?Missing MAC_CERTIFICATE_P12_BASE64}"
          : "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "Developer ID Application: VegaNext LLC (U46KNQN78Q)"

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          export APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '[:space:]')"
          export APPLE_APP_SPECIFIC_PASSWORD="$(printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | tr -d '[:space:]')"
          export APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" >/dev/null
          npx electron-builder --mac dmg zip --universal --publish never

      - name: Verify signature, Gatekeeper, notarization, and checksums
        run: |
          APP_PATH="dist/mac-universal/Drip Type.app"
          npm run verify:package -- "$APP_PATH"
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/Drip Type")"
          grep -qw x86_64 <<< "$ARCHS"
          grep -qw arm64 <<< "$ARCHS"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP_PATH" 2>&1)"
          ! grep -q "com.apple.security.cs.disable-library-validation" <<< "$ENTITLEMENTS"
          ! grep -q "com.apple.security.cs.allow-dyld-environment-variables" <<< "$ENTITLEMENTS"
          ! grep -q "com.apple.security.cs.allow-unsigned-executable-memory" <<< "$ENTITLEMENTS"
          ! grep -q "com.apple.security.cs.allow-jit" <<< "$ENTITLEMENTS"
          spctl --assess --verbose --type exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS.txt
          npm sbom --sbom-format spdx > dist/sbom.spdx.json

      - name: Smoke-test signed app launch
        shell: bash
        run: |
          APP_EXEC="dist/mac-universal/Drip Type.app/Contents/MacOS/Drip Type"
          LOG_PATH="$RUNNER_TEMP/drip-type-signed-smoke.log"
          "$APP_EXEC" >"$LOG_PATH" 2>&1 &
          APP_PID=$!
          for _ in {1..8}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$LOG_PATH"
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Verify update artifacts
        run: |
          test -s dist/latest-mac.yml
          find dist -maxdepth 1 -type f -name '*.dmg' -size +0 -print -quit | grep -q .
          find dist -maxdepth 1 -type f -name '*.zip' -size +0 -print -quit | grep -q .
          find dist -maxdepth 1 -type f -name '*.blockmap' -size +0 -print -quit | grep -q .

      - name: Stage atomic update feed
        env:
          VERCEL_ORG_ID: team_cf0UACFxMu4eJlD47WlfkLUa
          VERCEL_PROJECT_ID: prj_OnQ7adKj1xQcFfei4Rkj4sBVj7OV
        run: |
          mkdir -p update-site/.vercel
          cp updates-host/index.html updates-host/vercel.json update-site/
          cp dist/latest-mac.yml dist/*.dmg dist/*.zip dist/*.blockmap update-site/
          node -e 'const fs=require("fs"); fs.writeFileSync("update-site/.vercel/project.json", JSON.stringify({orgId:process.env.VERCEL_ORG_ID,projectId:process.env.VERCEL_PROJECT_ID}))'

      - name: Publish in-app update feed
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN}"
          npx --yes vercel@58.9.1 deploy update-site --prod --yes --token "$VERCEL_TOKEN"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: drip-type-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS.txt
            dist/sbom.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/developer-id.p12"

  release:
    name: Publish backup GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.build.outputs.release_sha }}
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS.txt' -o -name 'sbom.spdx.json' \) | sort)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_SHA}" --generate-notes
          fi
