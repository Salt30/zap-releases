name: Cross-platform desktop release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing v* release tag to rebuild
        required: true
        type: string
  create:

permissions:
  contents: read

concurrency:
  group: desktop-release-${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Build universal macOS app
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
      }}
    runs-on: macos-14
    environment: production-signing
    permissions:
      contents: read
    outputs:
      release_tag: ${{ steps.release.outputs.tag }}
      release_sha: ${{ steps.release.outputs.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          CREATED_REF: ${{ github.event.ref }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            RELEASE_TAG="$DISPATCH_TAG"
          else
            RELEASE_TAG="${CREATED_REF#release/}"
            RELEASE_TAG="${RELEASE_TAG%%/*}"
            RELEASE_TAG="${RELEASE_TAG%%-retry-*}"
          fi

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          [[ "$RELEASE_TAG" == "v${PACKAGE_VERSION}" ]]

          RELEASE_SHA="$(git rev-parse HEAD)"
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          [[ "$RELEASE_SHA" == "$MAIN_SHA" ]]

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "sha=$RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: |
          npm run verify
          npm audit --audit-level=low
          npm audit signatures

      - name: Import Developer ID certificate
        env:
          MAC_CERTIFICATE_P12_BASE64: ${{ secrets.MAC_CERTIFICATE_P12_BASE64 }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          : "${MAC_CERTIFICATE_P12_BASE64:?Missing MAC_CERTIFICATE_P12_BASE64}"
          : "${CSC_KEY_PASSWORD:?Missing CSC_KEY_PASSWORD}"
          CERTIFICATE_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$MAC_CERTIFICATE_P12_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$CSC_KEY_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain-db
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F "Developer ID Application: VegaNext LLC (U46KNQN78Q)"

      - name: Build, sign, and notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
        run: |
          : "${APPLE_ID:?Missing APPLE_ID}"
          : "${APPLE_APP_SPECIFIC_PASSWORD:?Missing APPLE_APP_SPECIFIC_PASSWORD}"
          : "${APPLE_TEAM_ID:?Missing APPLE_TEAM_ID}"
          export APPLE_ID="$(printf '%s' "$APPLE_ID" | tr -d '[:space:]')"
          export APPLE_APP_SPECIFIC_PASSWORD="$(printf '%s' "$APPLE_APP_SPECIFIC_PASSWORD" | tr -d '[:space:]')"
          export APPLE_TEAM_ID="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" >/dev/null
          npx electron-builder --mac dmg zip --universal --publish never

      - name: Verify signature, Gatekeeper, notarization, and checksums
        run: |
          APP_PATH="dist/mac-universal/Zap.app"
          npm run verify:package -- "$APP_PATH"
          node scripts/scan-secrets.js
          ARCHS="$(lipo -archs "$APP_PATH/Contents/MacOS/Zap")"
          grep -qw x86_64 <<< "$ARCHS"
          grep -qw arm64 <<< "$ARCHS"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ENTITLEMENTS="$(codesign -d --entitlements :- "$APP_PATH" 2>&1)"
          grep -q "com.apple.security.cs.allow-jit" <<< "$ENTITLEMENTS"
          ! grep -q "com.apple.security.cs.disable-library-validation" <<< "$ENTITLEMENTS"
          ! grep -q "com.apple.security.cs.allow-dyld-environment-variables" <<< "$ENTITLEMENTS"
          ! grep -q "com.apple.security.cs.allow-unsigned-executable-memory" <<< "$ENTITLEMENTS"
          spctl --assess --verbose --type exec "$APP_PATH"
          xcrun stapler validate "$APP_PATH"
          shasum -a 256 dist/*.dmg dist/*.zip > dist/SHA256SUMS-macos.txt
          npm sbom --sbom-format spdx > dist/sbom-macos.spdx.json

      - name: Smoke-test signed app launch
        shell: bash
        run: |
          APP_EXEC="dist/mac-universal/Zap.app/Contents/MacOS/Zap"
          LOG_PATH="$RUNNER_TEMP/drip-type-signed-smoke.log"
          "$APP_EXEC" >"$LOG_PATH" 2>&1 &
          APP_PID=$!
          for _ in {1..8}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$LOG_PATH"
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

      - name: Verify update artifacts
        run: |
          test -s dist/latest-mac.yml
          find dist -maxdepth 1 -type f -name '*.dmg' -size +0 -print -quit | grep -q .
          find dist -maxdepth 1 -type f -name '*.zip' -size +0 -print -quit | grep -q .
          find dist -maxdepth 1 -type f -name '*.blockmap' -size +0 -print -quit | grep -q .

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-macos-universal
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-macos.txt
            dist/sbom-macos.spdx.json
          if-no-files-found: error
          retention-days: 14

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/developer-id.p12"

  windows:
    name: Build and smoke-test Windows installer
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'create' && github.event.ref_type == 'branch' && startsWith(github.event.ref, 'release/v'))
      }}
    runs-on: windows-2025
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.event.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve and validate release
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
          CREATED_REF: ${{ github.event.ref }}
        run: |
          if ($env:EVENT_NAME -eq 'workflow_dispatch') { $releaseTag = $env:DISPATCH_TAG } else {
            $releaseTag = $env:CREATED_REF -replace '^release/', ''
            $releaseTag = ($releaseTag -split '/')[0]
            $releaseTag = $releaseTag -replace '-retry-.*$', ''
          }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') { throw 'Invalid release tag.' }
          $packageVersion = node -p "require('./package.json').version"
          if ($releaseTag -ne "v$packageVersion") { throw 'Release tag does not match package version.' }
          if ((git rev-parse HEAD) -ne (git rev-parse refs/remotes/origin/main)) { throw 'Release must match main.' }

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify source and dependencies
        run: |
          npm run verify
          npm audit --audit-level=low
          npm audit signatures

      - name: Build Windows installer and update metadata
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Verify hardened packaged app
        run: |
          npm run verify:package -- "dist/win-unpacked/Zap.exe"
          node scripts/scan-secrets.js

      - name: Smoke-test packaged app launch
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/win-unpacked/Zap.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged app exited early with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Verify Windows artifacts, checksums, and SBOM
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/latest.yml" -PathType Leaf)) { throw 'Missing latest.yml.' }
          $installer = Get-Item "dist/Zap-*-windows.exe"
          $blockmap = Get-Item "dist/Zap-*-windows.exe.blockmap"
          if ($installer.Length -eq 0 -or $blockmap.Length -eq 0) { throw 'Windows artifact is empty.' }
          Get-FileHash $installer.FullName -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $($installer.Name)" } | Set-Content "dist/SHA256SUMS-windows.txt"
          npm sbom --sbom-format spdx | Set-Content "dist/sbom-windows.spdx.json"

      - name: Upload release artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zap-windows-x64
          path: |
            dist/*.exe
            dist/*.yml
            dist/*.blockmap
            dist/SHA256SUMS-windows.txt
            dist/sbom-windows.spdx.json
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish backup GitHub release
    needs: [mac, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ needs.mac.outputs.release_tag }}
      RELEASE_SHA: ${{ needs.mac.outputs.release_sha }}
    steps:
      - name: Download signed artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -t FILES < <(find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name 'latest*.yml' -o -name '*.blockmap' -o -name 'SHA256SUMS-*.txt' -o -name 'sbom-*.spdx.json' \) | sort)
          if gh release view "${RELEASE_TAG}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${RELEASE_TAG}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --clobber
          else
            gh release create "${RELEASE_TAG}" "${FILES[@]}" --repo "${GITHUB_REPOSITORY}" --target "${RELEASE_SHA}" --generate-notes
          fi

  updater:
    name: Publish verified public updater
    needs: [mac, windows, release]
    runs-on: ubuntu-latest
    environment: production-signing
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out release source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ needs.mac.outputs.release_sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Download verified artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: release-artifacts

      - name: Stage updater files
        run: |
          mkdir -p dist update-site
          find release-artifacts -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' -o -name '*.blockmap' -o -name 'latest*.yml' \) -exec cp {} dist/ \;
          test -s dist/latest-mac.yml
          test -s dist/latest.yml

      - name: Publish immutable updater artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          : "${VERCEL_TOKEN:?Missing VERCEL_TOKEN}"
          npx vercel@50.19.1 link --yes --project=drip-type-updates --scope=salt30s-projects --cwd update-site --token="$VERCEL_TOKEN"
          npx vercel@50.19.1 pull --yes --environment=production --scope=salt30s-projects --cwd update-site --token="$VERCEL_TOKEN"
          set -a
          source update-site/.vercel/.env.production.local
          set +a
          node scripts/publish-update-blobs.js
          cp dist/latest-mac.yml dist/latest.yml update-site/
          npx vercel@50.19.1 deploy --prod --yes --scope=salt30s-projects --cwd update-site --token="$VERCEL_TOKEN"
