name: macOS quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and packaged app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and production bundle
        run: npm run verify

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=moderate

      - name: Package unsigned CI app
        run: npx electron-builder --mac --dir --x64 -c.mac.forceCodeSigning=false

      - name: Verify packaged app integrity
        run: npm run verify:package -- "dist/mac/Drip Type.app"
