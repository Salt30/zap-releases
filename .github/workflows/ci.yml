name: Desktop quality gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: mac-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify source and packaged app
    runs-on: macos-14
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and production bundle
        run: npm run verify

      - name: Audit dependencies and registry signatures
        run: |
          npm audit --audit-level=low
          npm audit signatures
          npm audit --prefix website --audit-level=low

      - name: Package unsigned CI app
        run: npx electron-builder --mac --dir --x64 -c.mac.forceCodeSigning=false

      - name: Verify packaged app integrity
        run: npm run verify:package -- "dist/mac/Zap.app"

      - name: Scan source, history and packaged app for credentials
        run: npm run audit:secrets

      - name: Smoke-test packaged app launch
        shell: bash
        run: |
          APP_EXEC="dist/mac/Zap.app/Contents/MacOS/Zap"
          LOG_PATH="$RUNNER_TEMP/drip-type-smoke.log"
          "$APP_EXEC" >"$LOG_PATH" 2>&1 &
          APP_PID=$!
          for _ in {1..8}; do
            if ! kill -0 "$APP_PID" 2>/dev/null; then
              cat "$LOG_PATH"
              exit 1
            fi
            sleep 1
          done
          kill "$APP_PID"
          wait "$APP_PID" || true

  windows:
    name: Verify Windows source and packaged app
    runs-on: windows-2025
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Verify source and production bundle
        run: npm run verify

      - name: Package unsigned CI app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack:win

      - name: Verify packaged app integrity
        run: npm run verify:package -- "dist/win-unpacked/Zap.exe"

      - name: Smoke-test packaged app launch
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist/win-unpacked/Zap.exe" -PassThru
          Start-Sleep -Seconds 8
          if ($process.HasExited) { throw "Packaged app exited early with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force
