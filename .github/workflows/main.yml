name: Build & Sign Zap (Windows)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g. v3.37.1) — leave empty to read from package.json'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - name: Get version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(node -p "require('./package.json').version")
            echo "version=v${VERSION}" >> $GITHUB_OUTPUT
          fi
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: "Zap ${{ steps.version.outputs.version }}"
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-win:
    needs: create-release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Install security build tools
        run: npm install --save-dev javascript-obfuscator

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build MinHook (x64)
        shell: cmd
        run: |
          git clone --depth 1 https://github.com/TsudaKageyu/minhook.git %RUNNER_TEMP%\minhook
          cd %RUNNER_TEMP%\minhook
          cl /nologo /O2 /MT /c src\hde\hde32.c src\hde\hde64.c src\buffer.c src\hook.c src\trampoline.c /Isrc /Iinclude
          lib /nologo /OUT:libMinHook.x64.lib hde32.obj hde64.obj buffer.obj hook.obj trampoline.obj
          mkdir "%GITHUB_WORKSPACE%\kernel\windows\vendor\minhook\include"
          mkdir "%GITHUB_WORKSPACE%\kernel\windows\vendor\minhook\lib"
          copy include\MinHook.h "%GITHUB_WORKSPACE%\kernel\windows\vendor\minhook\include\"
          copy libMinHook.x64.lib "%GITHUB_WORKSPACE%\kernel\windows\vendor\minhook\lib\"

      - name: Build zap_shield.dll + zap_overlay.dll
        shell: cmd
        run: |
          mkdir "%GITHUB_WORKSPACE%\dist\shield"
          cd kernel\windows\usermode
          cl /nologo /LD /O2 /W3 /DZAP_SHIELD_EXPORTS zap_shield.c /Fe:"%GITHUB_WORKSPACE%\dist\shield\zap_shield.dll" /link /DEF:zap_shield.def kernel32.lib user32.lib advapi32.lib
          cd ..\overlay
          cl /nologo /LD /O2 /EHsc /W3 /DZAP_OVERLAY_EXPORTS zap_overlay.cpp /I"%GITHUB_WORKSPACE%\kernel\windows\vendor\minhook\include" /Fe:"%GITHUB_WORKSPACE%\dist\shield\zap_overlay.dll" /link /DEF:zap_overlay.def "%GITHUB_WORKSPACE%\kernel\windows\vendor\minhook\lib\libMinHook.x64.lib" d3d11.lib dxgi.lib user32.lib kernel32.lib

      - name: Generate Windows icon
        shell: pwsh
        run: |
          pip install Pillow
          python -c "from PIL import Image; img=Image.open('assets/icon.png'); img.save('assets/icon.ico', format='ICO', sizes=[(256,256),(128,128),(64,64),(48,48),(32,32),(16,16)])"

      - name: Inject API keys
        shell: pwsh
        run: |
          (Get-Content src/main.js) -replace 'YOUR_OPENROUTER_API_KEY', '${{ secrets.OPENROUTER_API_KEY }}' | Set-Content src/main.js
          (Get-Content src/main.js) -replace 'YOUR_STRIPE_SECRET_KEY', '${{ secrets.STRIPE_SECRET_KEY }}' | Set-Content src/main.js
          (Get-Content src/main.js) -replace 'YOUR_GH_SUPPORT_TOKEN', '${{ secrets.GH_SUPPORT_TOKEN }}' | Set-Content src/main.js
          (Get-Content src/main.js) -replace 'YOUR_ADMIN_KEY_1', '${{ secrets.ADMIN_KEY_1 }}' | Set-Content src/main.js
          (Get-Content src/main.js) -replace 'YOUR_ADMIN_KEY_2', '${{ secrets.ADMIN_KEY_2 }}' | Set-Content src/main.js

      - name: Obfuscate source code
        run: node scripts/obfuscate.js

      - name: Build Windows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win nsis zip --publish never

      - name: Upload Windows assets
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $VERSION = "${{ needs.create-release.outputs.version }}"
          Get-ChildItem dist/*.exe, dist/*.zip | ForEach-Object {
            gh release upload $VERSION $_.FullName --clobber
          }

  publish:
    needs: [create-release, build-win]
    runs-on: ubuntu-latest
    if: needs.build-win.result == 'success'
    steps:
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ needs.create-release.outputs.version }}"
          gh release edit "$VERSION" --draft=false --latest --repo Salt30/zap-releases
